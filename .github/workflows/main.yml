name: test

on:
  push:
    branches:
      - master
      - swift6-upgrade
  pull_request:
  release:
    types:
      - created

jobs:
  vapor_macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Install mozjpeg
        run: brew install mozjpeg pkg-config
      - name: Test
        run: make test

  vapor_linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift_image:
          - swift:6.0-jammy
          - swift:6.0-noble
    container:
      image: ${{ matrix.swift_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native deps
        run: ./install-linux-dependencies.sh
      - name: Test
        run: make test
